name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server dependencies
        working-directory: server
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run server tests (Jest)
        working-directory: server
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret
        run: npm run test:ci

      - name: Install client dependencies
        working-directory: client
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run client tests (Jest)
        working-directory: client
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build client
        working-directory: client
        env:
          REACT_APP_API_URL: http://localhost:5000/api
        run: npm run build

      - name: Start server
        working-directory: server
        env:
          NODE_ENV: production
          USE_IN_MEMORY_DB: true
          JWT_SECRET: test_secret
          PORT: 5000
        shell: bash
        run: |
          npm start &
          echo "Server starting in background"
          sleep 2

      - name: Wait for API and DB health
        shell: bash
        run: |
          node -e "let i=0;const wait=async()=>{while(i++<120){try{const r=await fetch('http://localhost:5000/api/health');if(r.ok){const t=await r.json();if(t.status==='ok'&&t.db==='connected'){console.log('API + DB ready');process.exit(0);}}}catch(e){}await new Promise(r=>setTimeout(r,1000));}console.error('API not ready');process.exit(1)};wait()"

      - name: Seed database for E2E (via API)
        working-directory: server
        env:
          NODE_ENV: production
          USE_IN_MEMORY_DB: true
        run: node scripts/seed-http.js

      - name: Start client static server
        working-directory: client
        shell: bash
        run: |
          npx serve -s build -l 3000 &
          echo "Client starting in background"
          sleep 1

      - name: Wait for client to be ready
        shell: bash
        run: |
          node -e "let i=0;const wait=async()=>{while(i++<120){try{const r=await fetch('http://localhost:3000/');if(r.ok){console.log('Client ready');process.exit(0);}}catch(e){}await new Promise(r=>setTimeout(r,1000));}console.error('Client not ready');process.exit(1)};wait()"

      - name: Cypress run (headless)
        working-directory: client
        env:
          CYPRESS_baseUrl: http://localhost:3000
        run: npm run cypress:run

  # Cypress runs headlessly by default; matrix covers macOS/Windows/Linux.
