services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=5000
      - CONNECTION_URL=mongodb://mongo:27017/expense_tracker
      - JWT_SECRET=dev_local_jwt_secret_change_me
      - CLIENT_URL=http://localhost:3000
      - PUBLIC_BASE_URL=http://localhost:5000
      # Optional integrations (fill if you have them)
      - GOOGLE_CLIENT_ID=
      - SALT_EDGE_APP_ID=
      - SALT_EDGE_SECRET=
      - EMAIL_USERNAME=
      - EMAIL_PASSWORD=
      - FROM_NAME=ExpenseTracker
      - FROM_EMAIL=no-reply@example.com
    volumes:
      - ./server:/app
      - server_uploads:/app/uploads
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - BROWSER=none
      # Point browser requests directly to the host-exposed API port
      - REACT_APP_API_URL=http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

  seed:
    image: node:20-alpine
    working_dir: /app
    environment:
      - BASE_URL=http://server:5000
      - SEED_USER_EMAIL=demo@demo.com
      - SEED_USER_NAME=demo
      - SEED_USER_PASS=Password123!
    volumes:
      - ./server:/app
    command: ["node", "scripts/seed-http.js"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
  server_uploads:
